<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mikrotik Multi-Router Bandwidth Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (v10.8.0 - Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .graph-img { filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4)); min-height: 140px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Auth Screen Modal (PIN Protection) -->
    <div id="authModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center z-50">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 max-w-sm w-full text-center">
            <div class="w-16 h-16 bg-sky-500/10 text-sky-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl border border-sky-500/20">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">Masuk Dashboard</h2>
            <p class="text-slate-400 text-sm mb-6">Masukkan PIN keamanan untuk mengakses data router.</p>
            <input type="password" id="pinInput" placeholder="Masukkan PIN" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-center text-xl tracking-widest text-white focus:outline-none focus:border-sky-500 mb-4">
            <button onclick="verifyPin()" class="w-full bg-sky-500 hover:bg-sky-600 text-slate-950 font-bold py-3 rounded-xl transition duration-200">
                Buka Dashboard
            </button>
            <p id="authError" class="text-red-400 text-xs mt-3 hidden">PIN Salah! Silakan coba lagi.</p>
        </div>
    </div>

    <!-- Main Dashboard Container -->
    <div id="mainDashboard" class="hidden flex-1 flex flex-col">
        <!-- Header -->
        <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-wrap justify-between items-center gap-4 sticky top-0 z-40">
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-sky-500/10 text-sky-400 rounded-lg border border-sky-500/20">
                    <i class="fa-solid fa-network-wired text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight">Mikrotik Bandwidth Monitor</h1>
                    <p class="text-xs text-slate-400 flex items-center gap-2">
                        <span id="cloudStatus" class="inline-flex items-center text-emerald-400">
                            <span class="w-2 h-2 bg-emerald-400 rounded-full animate-ping mr-1.5"></span>
                            Terhubung ke Cloud Multi-User
                        </span>
                    </p>
                </div>
            </div>

            <!-- Header Actions -->
            <div class="flex items-center space-x-2">
                <button onclick="openAddModal()" class="bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/30 font-semibold px-3 py-2 rounded-lg text-sm flex items-center gap-2 transition">
                    <i class="fa-solid fa-plus"></i> Tambah Router
                </button>
                <button onclick="openChangePinModal()" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 font-semibold px-3 py-2 rounded-lg text-sm flex items-center gap-1.5 transition" title="Ganti PIN Access">
                    <i class="fa-solid fa-key"></i> Ganti PIN
                </button>
                <button onclick="forceResetCloudData()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 p-2 rounded-lg text-sm transition" title="Reset Data IP Publik Default">
                    <i class="fa-solid fa-arrows-rotate"></i> Reset IP Cloud
                </button>
                <button onclick="refreshGraphs()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 p-2 rounded-lg text-sm transition" title="Refresh Grafik">
                    <i class="fa-solid fa-rotate"></i>
                </button>
                <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 text-slate-400 border border-slate-700 p-2 rounded-lg text-sm transition" title="Keluar">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <!-- Router Cards Grid -->
        <main class="p-6 flex-1">
            <div id="routerGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Card Routers dirender secara dinamis -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-slate-900 border-t border-slate-800 px-6 py-4 text-center text-xs text-slate-500">
            Mikrotik Multi-Router Sync Dashboard &copy; 2026 - Firestore Cloud Integrated
        </footer>
    </div>

    <!-- Modal Tambah/Edit Router -->
    <div id="routerModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-slate-800 p-6 rounded-xl shadow-xl border border-slate-700 max-w-md w-full">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-lg font-bold">Tambah Router Baru</h3>
                <button onclick="closeRouterModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="routerForm" onsubmit="saveRouter(event)" class="space-y-4">
                <input type="hidden" id="routerId">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Router</label>
                    <input type="text" id="routerName" required placeholder="Contoh: RLZ, RMP, SERAYA" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">IP & Port Router (Publik)</label>
                    <input type="text" id="routerHost" required placeholder="Contoh: 116.90.181.18:891" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Interface Mikrotik</label>
                    <input type="text" id="routerInterface" required placeholder="Contoh: ether1, ether1-WAN, bridge1" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm focus:outline-none focus:border-sky-500">
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeRouterModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-sky-500 hover:bg-sky-600 text-slate-950 rounded-lg text-sm font-bold">Simpan Router</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Ganti PIN -->
    <div id="pinModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-slate-800 p-6 rounded-xl shadow-xl border border-slate-700 max-w-sm w-full">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Ganti PIN Akses Cloud</h3>
                <button onclick="closeChangePinModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="updateCloudPin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">PIN Lama</label>
                    <input type="password" id="oldPinInput" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">PIN Baru</label>
                    <input type="password" id="newPinInput" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm focus:outline-none focus:border-amber-500">
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeChangePinModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 rounded-lg text-sm font-bold">Update PIN</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // 1. KONFIGURASI FIREBASE CLOUD
        const firebaseConfig = {
            apiKey: "AIzaSyA4ZyFYenVo6JS3ER7juoe_weUk4JGS_u4",
            authDomain: "dashboard-mikrotik-464bf.firebaseapp.com",
            projectId: "dashboard-mikrotik-464bf",
            storageBucket: "dashboard-mikrotik-464bf.firebasestorage.app",
            messagingSenderId: "878428157799",
            appId: "1:878428157799:web:44c0217155f5f81ecca1c2",
            measurementId: "G-83TZKF3RXS"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentActivePin = "1234";
        let routersList = [];

        window.addEventListener('DOMContentLoaded', () => {
            fetchCloudSettings();
            if (sessionStorage.getItem('authenticated') === 'true') {
                showDashboard();
            }
        });

        // Sync Settings / PIN dari Cloud
        function fetchCloudSettings() {
            db.collection('settings').doc('access').onSnapshot((doc) => {
                if (doc.exists && doc.data().pin) {
                    currentActivePin = doc.data().pin;
                } else {
                    db.collection('settings').doc('access').set({ pin: "1234" });
                }
            });
        }

        function verifyPin() {
            const input = document.getElementById('pinInput').value;
            if (input === currentActivePin) {
                sessionStorage.setItem('authenticated', 'true');
                showDashboard();
            } else {
                document.getElementById('authError').classList.remove('hidden');
            }
        }

        function logout() {
            sessionStorage.removeItem('authenticated');
            location.reload();
        }

        function showDashboard() {
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            listenToFirebase();
        }

        function listenToFirebase() {
            db.collection('routers').onSnapshot((snapshot) => {
                routersList = [];
                snapshot.forEach((doc) => {
                    routersList.push({ id: doc.id, ...doc.data() });
                });

                if (routersList.length === 0) {
                    seedDefaultRouters();
                    return;
                }

                renderRouters();
            }, (error) => {
                console.error("Firebase Error:", error);
            });
        }

        // PERBAIKAN UTAMA: Pemasangan IP Publik Resmi Default
        function seedDefaultRouters() {
            const defaults = [
                { name: "RLZ", host: "116.90.181.18:891", interfaceName: "ether1" },
                { name: "RMP", host: "116.90.181.58:891", interfaceName: "ether1" },
                { name: "SERAYA", host: "116.90.181.61:891", interfaceName: "ether1" }
            ];
            defaults.forEach(r => db.collection('routers').add(r));
        }

        // Paksa Reset Data Cloud jika ada IP lokal tersisa
        async function forceResetCloudData() {
            if (confirm("Reset ulang semua daftar router di cloud ke IP Publik Default (RLZ, RMP, SERAYA)?")) {
                const snapshot = await db.collection('routers').get();
                const batch = db.batch();
                snapshot.docs.forEach((doc) => batch.delete(doc.ref));
                await batch.commit();
                seedDefaultRouters();
            }
        }

        function renderRouters() {
            const grid = document.getElementById('routerGrid');
            grid.innerHTML = '';

            routersList.forEach((router) => {
                const timestamp = new Date().getTime();
                let cleanHost = router.host.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
                
                const dailyGraphUrl = `http://${cleanHost}/graphs/iface/${router.interfaceName}/daily.gif?t=${timestamp}`;
                const webfigUrl = `http://${cleanHost}/webfig/`;

                const cardHtml = `
                    <div class="bg-slate-800 rounded-2xl border border-slate-700/80 p-5 flex flex-col justify-between shadow-lg hover:border-sky-500/40 transition duration-300">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <div>
                                    <h3 class="text-xl font-bold text-white flex items-center gap-2">
                                        <i class="fa-solid fa-server text-sky-400 text-base"></i> ${router.name}
                                    </h3>
                                    <p class="text-xs text-slate-400 font-mono mt-0.5">${cleanHost} (${router.interfaceName})</p>
                                </div>
                                <div class="flex space-x-1">
                                    <button onclick="openEditModal('${router.id}')" class="text-slate-400 hover:text-sky-400 p-1.5 rounded-lg hover:bg-slate-700 transition" title="Edit">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </button>
                                    <button onclick="deleteRouter('${router.id}')" class="text-slate-400 hover:text-red-400 p-1.5 rounded-lg hover:bg-slate-700 transition" title="Hapus">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="bg-slate-900/90 rounded-xl p-2 border border-slate-700/50 my-3 flex items-center justify-center min-h-[140px] overflow-hidden relative">
                                <img src="${dailyGraphUrl}" 
                                     alt="Graph ${router.name}" 
                                     class="graph-img max-w-full h-auto rounded"
                                     onerror="this.onerror=null; this.classList.add('hidden'); this.nextElementSibling.classList.remove('hidden');" />
                                
                                <div class="hidden text-center p-3">
                                    <i class="fa-solid fa-image-slash text-amber-400 text-2xl mb-2"></i>
                                    <p class="text-xs text-slate-300 font-semibold">Grafik Tidak Dapat Dimuat</p>
                                    <p class="text-[10px] text-slate-500 mt-1">Pastikan nama interface <b>${router.interfaceName}</b> aktif di MikroTik Graphing.</p>
                                    <a href="http://${cleanHost}/graphs/" target="_blank" class="mt-2 inline-block text-[11px] bg-slate-800 hover:bg-slate-700 text-sky-400 px-3 py-1 rounded border border-slate-700">
                                        Tes Buka Langsung <i class="fa-solid fa-external-link"></i>
                                    </a>
                                </div>
                            </div>
                        </div>

                        <div class="pt-2 flex justify-between items-center border-t border-slate-700/50 mt-2">
                            <a href="${webfigUrl}" target="_blank" class="text-xs bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/20 font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i> Buka WebFig
                            </a>
                            <a href="http://${cleanHost}/graphs/" target="_blank" class="text-xs text-slate-400 hover:text-slate-200 transition">
                                Detail Graph <i class="fa-solid fa-chevron-right text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        // CRUD Router
        function openAddModal() {
            document.getElementById('modalTitle').innerText = 'Tambah Router Baru';
            document.getElementById('routerId').value = '';
            document.getElementById('routerForm').reset();
            document.getElementById('routerModal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const router = routersList.find(r => r.id === id);
            if (!router) return;
            document.getElementById('modalTitle').innerText = 'Edit Router';
            document.getElementById('routerId').value = router.id;
            document.getElementById('routerName').value = router.name;
            document.getElementById('routerHost').value = router.host.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
            document.getElementById('routerInterface').value = router.interfaceName;
            document.getElementById('routerModal').classList.remove('hidden');
        }

        function closeRouterModal() {
            document.getElementById('routerModal').classList.add('hidden');
        }

        function saveRouter(e) {
            e.preventDefault();
            const id = document.getElementById('routerId').value;
            let cleanHost = document.getElementById('routerHost').value.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '');

            const data = {
                name: document.getElementById('routerName').value.trim(),
                host: cleanHost,
                interfaceName: document.getElementById('routerInterface').value.trim()
            };

            if (id) {
                db.collection('routers').doc(id).update(data);
            } else {
                db.collection('routers').add(data);
            }
            closeRouterModal();
        }

        function deleteRouter(id) {
            if (confirm('Yakin ingin menghapus router ini dari cloud?')) {
                db.collection('routers').doc(id).delete();
            }
        }

        // Manajemen PIN Cloud
        function openChangePinModal() {
            document.getElementById('pinModal').classList.remove('hidden');
        }

        function closeChangePinModal() {
            document.getElementById('pinModal').classList.add('hidden');
        }

        function updateCloudPin(e) {
            e.preventDefault();
            const oldPin = document.getElementById('oldPinInput').value;
            const newPin = document.getElementById('newPinInput').value;

            if (oldPin !== currentActivePin) {
                alert("PIN Lama Salah!");
                return;
            }

            db.collection('settings').doc('access').set({ pin: newPin }).then(() => {
                alert("PIN Akses Cloud Berhasil Diperbarui!");
                closeChangePinModal();
            });
        }

        function refreshGraphs() {
            renderRouters();
        }
    </script>
</body>
</html>
