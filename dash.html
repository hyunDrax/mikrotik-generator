<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mikrotik Multi-User Bandwidth Monitor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (v10.8.0 - Compatibility Mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .graph-img { filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4)); min-height: 140px; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Auth Screen Modal (Login / Register Multi-User) -->
    <div id="authModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center z-50">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 max-w-sm w-full">
            <div class="w-16 h-16 bg-sky-500/10 text-sky-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl border border-sky-500/20">
                <i class="fa-solid fa-users-gear"></i>
            </div>
            <h2 id="authTitle" class="text-2xl font-bold mb-1 text-center">Login Multi-User</h2>
            <p class="text-slate-400 text-xs text-center mb-6">Masukkan kredensial pengguna Anda.</p>
            
            <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Email / Username</label>
                    <input type="email" id="authEmail" required placeholder="user@domain.com" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Password / PIN</label>
                    <input type="password" id="authPassword" required placeholder="******" class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-sm text-white focus:outline-none focus:border-sky-500">
                </div>
                <button type="submit" id="authSubmitBtn" class="w-full bg-sky-500 hover:bg-sky-600 text-slate-950 font-bold py-3 rounded-xl transition duration-200">
                    Masuk
                </button>
            </form>

            <div class="mt-4 text-center">
                <button onclick="toggleAuthMode()" id="toggleAuthBtn" class="text-xs text-sky-400 hover:underline">
                    Belum punya akun? Daftar User Baru
                </button>
            </div>
            <p id="authError" class="text-red-400 text-xs mt-3 text-center hidden"></p>
        </div>
    </div>

    <!-- Main Dashboard Container -->
    <div id="mainDashboard" class="hidden flex-1 flex flex-col">
        <!-- Header -->
        <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-wrap justify-between items-center gap-4 sticky top-0 z-40">
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-sky-500/10 text-sky-400 rounded-lg border border-sky-500/20">
                    <i class="fa-solid fa-network-wired text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight">Mikrotik Bandwidth Monitor</h1>
                    <p class="text-xs text-slate-400 flex items-center gap-2">
                        <span id="userDisplay" class="text-sky-400 font-semibold"><i class="fa-solid fa-user-circle mr-1"></i> -</span>
                    </p>
                </div>
            </div>

            <!-- Header Actions -->
            <div class="flex items-center space-x-2">
                <!-- Tombol Tambah Router (Hanya Tampil untuk Admin) -->
                <button id="addRouterBtn" onclick="openAddModal()" class="bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 border border-sky-500/30 font-semibold px-3 py-2 rounded-lg text-sm flex items-center gap-2 transition hidden">
                    <i class="fa-solid fa-plus"></i> Tambah Router
                </button>
                <button onclick="openChangePasswordModal()" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 font-semibold px-3 py-2 rounded-lg text-sm flex items-center gap-1.5 transition" title="Ganti Password Akun Ini">
                    <i class="fa-solid fa-key"></i> Ganti Password
                </button>
                <!-- Tombol Reset (Hanya Tampil untuk Admin) -->
                <button id="resetCloudBtn" onclick="forceResetCloudData()" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 p-2 rounded-lg text-sm transition hidden" title="Reset IP Cloud ke Publik (Admin Only)">
                    <i class="fa-solid fa-arrows-rotate"></i> Reset IP
                </button>
                <button onclick="refreshGraphs()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 p-2 rounded-lg text-sm transition" title="Refresh Grafik">
                    <i class="fa-solid fa-rotate"></i>
                </button>
                <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 text-slate-400 border border-slate-700 p-2 rounded-lg text-sm transition" title="Keluar">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <!-- Router Cards Grid -->
        <main class="p-6 flex-1">
            <div id="routerGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Card Routers dirender secara dinamis -->
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-slate-900 border-t border-slate-800 px-6 py-4 text-center text-xs text-slate-500">
            Mikrotik Multi-User Dashboard &copy; 2026 - Firestore Cloud Integrated
        </footer>
    </div>

    <!-- Modal Tambah/Edit Router (Admin Only) -->
    <div id="routerModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-slate-800 p-6 rounded-xl shadow-xl border border-slate-700 max-w-md w-full">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-lg font-bold">Tambah Router Baru</h3>
                <button onclick="closeRouterModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="routerForm" onsubmit="saveRouter(event)" class="space-y-4">
                <input type="hidden" id="routerId">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Router</label>
                    <input type="text" id="routerName" required placeholder="Contoh: RLZ, RMP, SERAYA" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">IP & Port Router (Publik)</label>
                    <input type="text" id="routerHost" required placeholder="Contoh: 116.90.181.18:891" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Interface Mikrotik</label>
                    <input type="text" id="routerInterface" required placeholder="Contoh: ether1, ether1-WAN, bridge1" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm focus:outline-none focus:border-sky-500">
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeRouterModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-sky-500 hover:bg-sky-600 text-slate-950 rounded-lg text-sm font-bold">Simpan Router</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Ganti Password -->
    <div id="passwordModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-slate-800 p-6 rounded-xl shadow-xl border border-slate-700 max-w-sm w-full">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">Ganti Password Akun</h3>
                <button onclick="closeChangePasswordModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="updateUserPassword(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Password Baru</label>
                    <input type="password" id="newPasswordInput" required minlength="6" placeholder="Minimal 6 Karakter" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm focus:outline-none focus:border-amber-500">
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeChangePasswordModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-semibold">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 rounded-lg text-sm font-bold">Simpan Password</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // 1. KONFIGURASI FIREBASE CLOUD
        const firebaseConfig = {
            apiKey: "AIzaSyA4ZyFYenVo6JS3ER7juoe_weUk4JGS_u4",
            authDomain: "dashboard-mikrotik-464bf.firebaseapp.com",
            projectId: "dashboard-mikrotik-464bf",
            storageBucket: "dashboard-mikrotik-464bf.firebasestorage.app",
            messagingSenderId: "878428157799",
            appId: "1:878428157799:web:44c0217155f5f81ecca1c2",
            measurementId: "G-83TZKF3RXS"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // DAFTAR EMAIL ADMIN (Punya Akses Tambah, Edit, dan Hapus)
        const ADMIN_EMAILS = [
            "voice.pekanbaru@gmail.com"
        ];

        let isRegisterMode = false;
        let routersList = [];
        let currentUserEmail = "";

        // Auth Listener Multi-User
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUserEmail = user.email.toLowerCase();
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('mainDashboard').classList.remove('hidden');
                
                const isAdmin = ADMIN_EMAILS.includes(currentUserEmail);
                document.getElementById('userDisplay').innerHTML = `
                    <i class="fa-solid fa-user-circle mr-1"></i> ${user.email} 
                    ${isAdmin ? '<span class="ml-1 px-1.5 py-0.5 text-[10px] bg-red-500/20 text-red-400 border border-red-500/30 rounded font-bold">ADMIN</span>' : '<span class="ml-1 px-1.5 py-0.5 text-[10px] bg-slate-700 text-slate-300 rounded font-semibold">VIEW ONLY</span>'}
                `;

                // Tampilkan/Sembunyikan tombol Tambah & Reset khusus Admin
                if (isAdmin) {
                    document.getElementById('addRouterBtn').classList.remove('hidden');
                    document.getElementById('resetCloudBtn').classList.remove('hidden');
                } else {
                    document.getElementById('addRouterBtn').classList.add('hidden');
                    document.getElementById('resetCloudBtn').classList.add('hidden');
                }

                listenToFirebase();
            } else {
                currentUserEmail = "";
                document.getElementById('authModal').classList.remove('hidden');
                document.getElementById('mainDashboard').classList.add('hidden');
            }
        });

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('authTitle').innerText = isRegisterMode ? 'Daftar Akun Baru' : 'Login Multi-User';
            document.getElementById('authSubmitBtn').innerText = isRegisterMode ? 'Daftar Akun' : 'Masuk';
            document.getElementById('toggleAuthBtn').innerText = isRegisterMode ? 'Sudah punya akun? Login' : 'Belum punya akun? Daftar User Baru';
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const errEl = document.getElementById('authError');
            errEl.classList.add('hidden');

            if (isRegisterMode) {
                auth.createUserWithEmailAndPassword(email, password).catch(err => {
                    errEl.innerText = err.message;
                    errEl.classList.remove('hidden');
                });
            } else {
                auth.signInWithEmailAndPassword(email, password).catch(err => {
                    errEl.innerText = "Email atau Password Salah!";
                    errEl.classList.remove('hidden');
                });
            }
        }

        function logout() {
            auth.signOut();
        }

        function listenToFirebase() {
            db.collection('routers').onSnapshot((snapshot) => {
                routersList = [];
                snapshot.forEach((doc) => {
                    routersList.push({ id: doc.id, ...doc.data() });
                });

                if (routersList.length === 0 && ADMIN_EMAILS.includes(currentUserEmail)) {
                    seedDefaultRouters();
                    return;
                }

                renderRouters();
            });
        }

        function seedDefaultRouters() {
            const defaults = [
                { name: "RLZ", host: "116.90.181.18:891", interfaceName: "ether1" },
                { name: "RMP", host: "116.90.181.58:891", interfaceName: "ether1" },
                { name: "SERAYA", host: "116.90.181.61:891", interfaceName: "ether1" }
            ];
            defaults.forEach(r => db.collection('routers').add(r));
        }

        async function forceResetCloudData() {
            if (!ADMIN_EMAILS.includes(currentUserEmail)) {
                alert("Akses Ditolak! Hanya Admin yang diizinkan mereset data cloud.");
                return;
            }

            if (confirm("Reset ulang semua daftar router di cloud ke IP Publik Default (RLZ, RMP, SERAYA)?")) {
                const snapshot = await db.collection('routers').get();
                const batch = db.batch();
                snapshot.docs.forEach((doc) => batch.delete(doc.ref));
                await batch.commit();
                seedDefaultRouters();
            }
        }

        function renderRouters() {
            const grid = document.getElementById('routerGrid');
            grid.innerHTML = '';

            const isAdmin = ADMIN_EMAILS.includes(currentUserEmail);

            routersList.forEach((router) => {
                const timestamp = new Date().getTime();
                let cleanHost = router.host.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
                
                const rawGraphUrl = `http://${cleanHost}/graphs/iface/${router.interfaceName}/daily.gif?t=${timestamp}`;
                const proxyGraphUrl = `https://wsrv.nl/?url=${encodeURIComponent(rawGraphUrl)}&n=-1`;

                const activeUserWebfigUrl = `http://${cleanHost}/webfig/#IP:Hotspot.Active`;
                const fullGraphUrl = `http://${cleanHost}/graphs/iface/${router.interfaceName}/`;

                // Tombol Edit dan Hapus HANYA dirender jika pengguna adalah ADMIN
                const adminActionButtons = isAdmin ? `
                    <div class="flex space-x-1">
                        <button onclick="openEditModal('${router.id}')" class="text-slate-400 hover:text-sky-400 p-1.5 rounded-lg hover:bg-slate-700 transition" title="Edit Router">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button onclick="deleteRouter('${router.id}')" class="text-slate-400 hover:text-red-400 p-1.5 rounded-lg hover:bg-slate-700 transition" title="Hapus Router">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                ` : '';

                const cardHtml = `
                    <div class="bg-slate-800 rounded-2xl border border-slate-700/80 p-5 flex flex-col justify-between shadow-lg hover:border-sky-500/40 transition duration-300">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <div>
                                    <h3 class="text-xl font-bold text-white flex items-center gap-2">
                                        <i class="fa-solid fa-server text-sky-400 text-base"></i> ${router.name}
                                    </h3>
                                    <p class="text-xs text-slate-400 font-mono mt-0.5">${cleanHost} (${router.interfaceName})</p>
                                </div>
                                ${adminActionButtons}
                            </div>

                            <!-- Area Rendering Grafik -->
                            <div class="bg-slate-900/90 rounded-xl p-2 border border-slate-700/50 my-3 flex items-center justify-center min-h-[140px] overflow-hidden relative">
                                <img src="${proxyGraphUrl}" 
                                     alt="Graph ${router.name}" 
                                     class="graph-img max-w-full h-auto rounded"
                                     onerror="this.onerror=null; this.src='${rawGraphUrl}'; this.onerror=function(){ this.classList.add('hidden'); this.nextElementSibling.classList.remove('hidden'); };" />
                                
                                <div class="hidden text-center p-3">
                                    <i class="fa-solid fa-chart-area text-sky-400 text-2xl mb-2"></i>
                                    <p class="text-xs text-slate-300 font-semibold">Cek Interface / Koneksi MikroTik</p>
                                    <p class="text-[10px] text-slate-400 mt-1 mb-2">Interface <b>${router.interfaceName}</b> mungkin tidak aktif di Graphing.</p>
                                    <a href="${fullGraphUrl}" target="_blank" class="inline-block text-xs bg-sky-500 hover:bg-sky-600 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition">
                                        <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> Buka Grafik Langsung
                                    </a>
                                </div>
                            </div>
                        </div>

                        <div class="pt-2 flex justify-between items-center border-t border-slate-700/50 mt-2">
                            <!-- Tombol Active Users tetap bisa diakses semua user -->
                            <a href="${activeUserWebfigUrl}" target="_blank" class="text-xs bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 font-semibold px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition">
                                <i class="fa-solid fa-users text-xs"></i> Active Users
                            </a>
                            <a href="${fullGraphUrl}" target="_blank" class="text-xs text-slate-400 hover:text-slate-200 transition">
                                Detail Graph <i class="fa-solid fa-chevron-right text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
        }

        // CRUD Router
        function openAddModal() {
            if (!ADMIN_EMAILS.includes(currentUserEmail)) {
                alert("Akses Ditolak! Anda hanya memiliki hak akses View Only.");
                return;
            }
            document.getElementById('modalTitle').innerText = 'Tambah Router Baru';
            document.getElementById('routerId').value = '';
            document.getElementById('routerForm').reset();
            document.getElementById('routerModal').classList.remove('hidden');
        }

        function openEditModal(id) {
            if (!ADMIN_EMAILS.includes(currentUserEmail)) {
                alert("Akses Ditolak! Anda hanya memiliki hak akses View Only.");
                return;
            }
            const router = routersList.find(r => r.id === id);
            if (!router) return;
            document.getElementById('modalTitle').innerText = 'Edit Router';
            document.getElementById('routerId').value = router.id;
            document.getElementById('routerName').value = router.name;
            document.getElementById('routerHost').value = router.host.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
            document.getElementById('routerInterface').value = router.interfaceName;
            document.getElementById('routerModal').classList.remove('hidden');
        }

        function closeRouterModal() {
            document.getElementById('routerModal').classList.add('hidden');
        }

        function saveRouter(e) {
            e.preventDefault();
            if (!ADMIN_EMAILS.includes(currentUserEmail)) {
                alert("Akses Ditolak! Hanya Admin yang diizinkan menyimpan perubahan.");
                return;
            }

            const id = document.getElementById('routerId').value;
            let cleanHost = document.getElementById('routerHost').value.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '');

            const data = {
                name: document.getElementById('routerName').value.trim(),
                host: cleanHost,
                interfaceName: document.getElementById('routerInterface').value.trim()
            };

            if (id) {
                db.collection('routers').doc(id).update(data);
            } else {
                db.collection('routers').add(data);
            }
            closeRouterModal();
        }

        function deleteRouter(id) {
            if (!ADMIN_EMAILS.includes(currentUserEmail)) {
                alert("Akses Ditolak! Hanya Admin yang diizinkan menghapus router.");
                return;
            }

            if (confirm('Yakin ingin menghapus router ini dari cloud?')) {
                db.collection('routers').doc(id).delete();
            }
        }

        // Ganti Password Akun Logged In
        function openChangePasswordModal() {
            document.getElementById('passwordModal').classList.remove('hidden');
        }

        function closeChangePasswordModal() {
            document.getElementById('passwordModal').classList.add('hidden');
        }

        function updateUserPassword(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPasswordInput').value;
            const user = auth.currentUser;

            if (user) {
                user.updatePassword(newPassword).then(() => {
                    alert("Password akun berhasil diperbarui!");
                    closeChangePasswordModal();
                }).catch(err => {
                    alert("Gagal update password: " + err.message);
                });
            }
        }

        function refreshGraphs() {
            renderRouters();
        }
    </script>
</body>
</html>
